<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FES-DMS — Asset & Icon Library</title>
<style>
:root{--blue:#1F4397;--green:#39A248;--ink:#1f2a44;--muted:#6b7890;--line:#e7ecf3;--bg:#f4f6fb}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:26px 32px}
h1{margin:0;font-size:22px;color:var(--blue)}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
main{padding:26px 32px;max-width:1200px;margin:0 auto}
h2{font-size:15px;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
h2 .n{font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;transition:.15s}
figure:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(31,67,151,.08)}
.ic{height:40px;display:grid;place-items:center;color:var(--ink)}
.ic img{max-width:28px;max-height:28px;width:auto;height:auto}
.big .ic{height:120px}.big .ic img{max-width:140px;max-height:110px}
figcaption{margin-top:10px;font-size:11px;color:var(--muted);word-break:break-word;line-height:1.3}
.imgrow{display:flex;gap:20px;flex-wrap:wrap}
.imgrow figure{padding:20px;min-width:200px}
.imgrow img{max-width:200px;max-height:80px}
</style></head><body>
